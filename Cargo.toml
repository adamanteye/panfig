[workspace]
resolver = "2"
members = ["tex", "image"]

[package]
name = "panfig"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Xuelin Yang <xuelin@adamanteye.cc>"]
description = "Import PGF, TikZ and SVG figures as Typst content"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
panfig-image = { path = "image" }
kurbo = "0.11.3"
# keep the converter and the Typst scope in lib.typ on the same release.
mitex = { git = "https://github.com/mitex-rs/mitex", tag = "0.2.7" }
mitex-lexer = { git = "https://github.com/mitex-rs/mitex", tag = "0.2.7" }
# the upstream prebuilt command table predates the Typst 0.15 symbol names.
mitex-spec-gen = { git = "https://github.com/mitex-rs/mitex", tag = "0.2.7", features = ["generate"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
svgtypes = "0.15"
roxmltree = "0.20"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-minimal-protocol = "0.2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
