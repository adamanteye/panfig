[package]
name = "panfig-tex"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
dvi = "0.2.2"
panfig-image = { path = "../image" }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
flate2 = "1"
tar = { version = "0.4", default-features = false }
typwire.workspace = true
wasm-minimal-protocol = "0.2.1"
