name: Package for Typst Universe
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Check release tag
        run: grep -Fqx "version = \"$TAG\"" typst.toml
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Install Wasm build tools
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y wabt binaryen fonts-dejavu-core
      - name: Build and test the package
        run: |
          make package
          make check
      - name: Compile the example from the release archive
        run: |
          tar -xzf "target/panfig-$TAG.tar.gz" -C "$RUNNER_TEMP"
          examples="$RUNNER_TEMP/packages/preview/panfig/$TAG/examples"
          typst compile --package-path "$RUNNER_TEMP/packages" "$examples/hydrogen.typ" "$RUNNER_TEMP/hydrogen.pdf"
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "target/panfig-$TAG.tar.gz" --clobber
